<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Privacy lock: the page may not connect anywhere (no fetch/XHR/WebSocket). Worlds are read on this device only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; worker-src 'self' blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'" />
    <title>World Viewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22%3E%E2%97%88%3C/text%3E%3C/svg%3E" />
    <!-- Generated by `node scripts/build-data.mjs` / `/visualize`; missing is fine. -->
    <script src="./data/worlds.js" onerror="window.WORLD_INDEX = window.WORLD_INDEX || []"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
